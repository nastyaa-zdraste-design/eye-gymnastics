<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Гимнастика для глаз</title>
<link rel="stylesheet" href="break.css">
</head>
<body class="mode-step">
<div id="stage">
  <div id="sun"><div id="pulse"><div class="glow"></div><div class="core"></div></div></div>

  <main id="panel">
    <div id="intro" class="group" hidden>
      <div id="snoozed"></div>
      <div id="caption" class="big"></div>
    </div>
    <div id="step" class="group">
      <div id="head" class="small"></div>
      <div id="title" class="big"></div>
      <div id="body"></div>
    </div>
    <div id="final" class="group" hidden>
      <div class="small">Готово!</div>
      <div id="joke"></div>
    </div>
    <div id="line"><div id="fill"></div></div>
  </main>

  <nav id="btns">
    <button id="bStart" class="primary" hidden>Начать</button>
    <button id="bSkip" class="primary" hidden>
      <span>Следующее</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
    </button>
    <button id="bSnooze"><span class="fillbar"></span><span class="lbl"></span></button>
    <button id="bBack" class="primary" hidden>Вернуться к работе</button>
  </nav>
  <div id="hint"></div>
</div>

<script src="../timeline.js"></script>
<script src="break.js"></script>
</body>
</html>
