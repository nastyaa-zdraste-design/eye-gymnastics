<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>напоминание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
  body { font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }

  /* ---- глаза ---- */
  .eyes { position: absolute; display: flex; gap: 1.2vmin; align-items: center;
          transition: transform .8s cubic-bezier(.3,1.4,.5,1); filter: drop-shadow(0 .8vmin 1.6vmin rgba(0,0,0,.35)); }
  .eye { position: relative; width: var(--size); height: var(--size); border-radius: 50%; overflow: hidden;
         background: radial-gradient(circle at 50% 45%, #fffdf8 58%, #f2e4d6 100%);
         box-shadow: inset 0 0 0 .55vmin #2a1712; }
  .sleepy .eye { background: radial-gradient(circle at 50% 45%, #fff6f0 42%, #f6c8bd 78%, #ec9f93 100%); }
  .iris { position: absolute; width: 46%; height: 46%; left: 27%; top: 27%; border-radius: 50%;
          background: radial-gradient(circle at 42% 40%, #d19559, #7a4424 72%); }
  .pupil { position: absolute; inset: 26%; border-radius: 50%; background: #140b08; }
  .pupil::after { content: ''; position: absolute; width: 34%; height: 34%; left: 16%; top: 14%;
                  border-radius: 50%; background: rgba(255,255,255,.85); }
  .lid { position: absolute; left: -6%; right: -6%; top: -6%; height: 112%; transform-origin: 50% 0;
         transform: scaleY(0); background: linear-gradient(#e2a27a, #d38c63);
         box-shadow: inset 0 -.55vmin 0 #2a1712; }
  .say { position: absolute; white-space: nowrap; font-size: 1.9vmin; color: #2a1712; background: #fff4e8;
         padding: .7vmin 1.4vmin; border-radius: 1.6vmin; box-shadow: 0 .4vmin 1.4vmin rgba(0,0,0,.25);
         opacity: 0; transition: opacity .4s; }
  .say.show { opacity: 1; }

  /* ---- призрачные курсоры ---- */
  .ghost { position: absolute; left: 0; top: 0; width: 2.6vmin; height: 3.9vmin; opacity: 0;
           transition: opacity .6s; will-change: transform; filter: blur(.4px); }
  .ghost.show { opacity: var(--o, .55); }

  /* ---- дымка уставшего зрения ---- */
  #haze { position: absolute; inset: 0; opacity: 0; transition: opacity 2s;
          background: radial-gradient(ellipse at center, transparent 48%, rgba(40,16,10,.28) 78%, rgba(30,10,6,.55) 100%); }
  #haze.on { opacity: 1; animation: haze 7s ease-in-out infinite; }
  @keyframes haze { 0%,100% { filter: blur(0); opacity: .75; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="haze"></div>
<script src="nag.js"></script>
</body>
</html>
