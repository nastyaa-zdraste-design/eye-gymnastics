# Сборка установщиков для Windows и Mac.
# Запускается, когда в репозиторий отправляют метку версии, например v1.0.0.
# Сначала собираются установщики, потом одно задание складывает их
# в черновик релиза — опубликовать его нужно вручную.
name: Сборка релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Проверки
        run: npm run check

      - name: Сборка для Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never

      - name: Сборка для Mac (без подписи Apple)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Что собралось
        shell: bash
        run: ls -lh dist | grep -v '^total'

      - uses: actions/upload-artifact@v4
        with:
          name: ustanovshchiki-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml

  # Отдельное задание: иначе Windows и Mac создают по своему черновику
  # с одной и той же меткой, и файлы разъезжаются по двум релизам.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Список файлов
        run: ls -lh dist | grep -v '^total'

      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --notes "Установщик для Windows — файл .exe. Для Mac: -arm64 для компьютеров на Apple Silicon (M1 и новее), -x64 для более старых на Intel."
          fi
