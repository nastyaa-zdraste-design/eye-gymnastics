<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #C9D6C3; }
    a { color: #3E5143; }
    a:hover { color: #2F3D33; }
    /* Упражнение сжато до 8 с для показа. Вдох — с лёгкой пружинкой (ease-out-back),
       выдох — ease-in-out. На 5-й, 6-й и 7-й секунде край стекла вспыхивает: 3-2-1. */
    @keyframes springBreath {
      0%   { transform: translate(-50%, -50%) scale(0.88); opacity: 0.7; animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
      45%  { transform: translate(-50%, -50%) scale(1.10); opacity: 1;   animation-timing-function: cubic-bezier(.645, .045, .355, 1); }
      100% { transform: translate(-50%, -50%) scale(0.88); opacity: 0.7; }
    }
    @keyframes tick {
      0%, 62.5% { opacity: 0; }
      65.6%     { opacity: 1; animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      68%       { opacity: 0; }
      75%       { opacity: 0; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      78.1%     { opacity: 1; animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      80.5%     { opacity: 0; }
      87.5%     { opacity: 0; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      90.6%     { opacity: 1; animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      93%, 100% { opacity: 0; }
    }
    @keyframes progress {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes dotTick {
      0%, 62.5% { transform: translate(-50%, -50%) scale(1); }
      65.6%     { transform: translate(-50%, -50%) scale(1.9); animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      68%       { transform: translate(-50%, -50%) scale(1); }
      75%       { transform: translate(-50%, -50%) scale(1); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      78.1%     { transform: translate(-50%, -50%) scale(1.9); animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      80.5%     { transform: translate(-50%, -50%) scale(1); }
      87.5%     { transform: translate(-50%, -50%) scale(1); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      90.6%     { transform: translate(-50%, -50%) scale(1.9); animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      93%, 100% { transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes dotMove {
      from { transform: translateX(0%); }
      to   { transform: translateX(100%); }
    }
    .sun   { animation: springBreath 8s infinite; will-change: transform, opacity; }
    .tick  { animation: tick 8s infinite; }
    .bar   { transform-origin: 0 50%; animation: progress 8s linear infinite; }
    .track { animation: dotMove 8s linear infinite; will-change: transform; }
    .dot   { animation: dotTick 8s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .sun, .bar, .dot, .track { animation: none; }
      .tick { animation: none; opacity: 0; }
    }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1500px 1100px at 50% 46%, #E8EEE3 0%, #CFDBC9 55%, #B4C6AD 100%); font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif;">

  <div class="sun" style="position: absolute; left: 960px; top: 470px; width: 1350px; height: 1350px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(253,254,250,1) 0%, rgba(236,243,230,0.9) 20%, rgba(214,226,206,0.34) 44%, rgba(214,226,206,0) 66%);"></div>

  <div style="position: absolute; left: 50%; top: 440px; transform: translate(-50%, -50%); width: 1120px; box-sizing: border-box; padding: 60px 72px 56px; border-radius: 48px; background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.60); box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 30px 80px rgba(62,81,67,0.16); backdrop-filter: blur(30px) saturate(115%); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;">
    <div class="tick" style="position: absolute; inset: -3px; border-radius: 51px; opacity: 0; pointer-events: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.95), 0 0 36px 6px rgba(246,250,242,0.85);"></div>
    <div style="font-size: 20px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #5E6F61; font-variant-numeric: tabular-nums;">Шаг 6 из 8   ·   до конца 0:55</div>
    <div style="font-size: 96px; font-weight: 500; line-height: 1.02; letter-spacing: -0.02em; color: #2F3D33;">Движения глазами</div>
    <div style="font-size: 33px; line-height: 1.5; color: #43534A; white-space: pre-wrap; text-wrap: balance;">Голова неподвижна, движения медленные и мягкие:
вверх-вниз  ·  влево-вправо  ·  по диагоналям  ·  круг в одну и в другую сторону.</div>
    <div style="position: relative; margin-top: 10px; width: 100%; height: 4px; border-radius: 2px; background: rgba(47,61,51,0.12);">
      <div class="bar" style="width: 100%; height: 100%; border-radius: 2px; background: rgba(47,61,51,0.55); transform: scaleX(0.5); transform-origin: 0 50%;"></div>
      <div class="track" style="position: absolute; inset: 0; pointer-events: none; transform: translateX(50%);">
        <div class="dot" style="position: absolute; left: 0; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #3E5143; box-shadow: 0 0 0 4px rgba(255,255,255,0.7); transform: translate(-50%, -50%);"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 17px 34px; border-radius: 999px; background: #3E5143; color: #F2F5EE; font-size: 22px; font-weight: 500;">
      <span>Следующее</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; padding: 16px 32px; border-radius: 999px; background: rgba(255,255,255,0.32); border: 1px solid rgba(255,255,255,0.6); backdrop-filter: blur(20px); color: #2F3D33; font-size: 22px; font-weight: 500;">Отложить на 20 мин</div>
  </div>
</div>
</x-dc>
</body>
</html>
