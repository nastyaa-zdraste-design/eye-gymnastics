<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #7D8C97; }
    a { color: #F7F9FA; }
    a:hover { color: #FFFFFF; }
    @keyframes mistA { from { transform: translateX(-260px); } to { transform: translateX(260px); } }
    @keyframes mistB { from { transform: translateX(220px); } to { transform: translateX(-220px); } }
    .mist-a { animation: mistA 55s ease-in-out infinite alternate; }
    .mist-b { animation: mistB 70s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) { .mist-a, .mist-b { animation: none; } }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(180deg, #A3B0B9 0%, #8795A0 45%, #6C7B86 100%); font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; left: 960px; top: 210px; width: 900px; height: 900px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(244,247,248,0.55) 0%, rgba(214,223,229,0.25) 40%, rgba(214,223,229,0) 70%);"></div>
  <div style="position: absolute; left: 960px; top: 210px; width: 230px; height: 230px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 45% 42%, #F7F9FA 0%, #E2E8EC 55%, rgba(226,232,236,0.4) 100%);"></div>

  <div class="mist-a" style="position: absolute; left: -340px; top: 300px; width: 2600px; height: 150px; border-radius: 50%; background: rgba(233,238,241,0.20); filter: blur(46px);"></div>
  <div class="mist-b" style="position: absolute; left: -340px; top: 640px; width: 2600px; height: 190px; border-radius: 50%; background: rgba(233,238,241,0.16); filter: blur(56px);"></div>
  <div class="mist-a" style="position: absolute; left: -340px; top: 900px; width: 2600px; height: 170px; border-radius: 50%; background: rgba(233,238,241,0.18); filter: blur(50px); animation-delay: -20s;"></div>

  <div style="position: absolute; left: 50%; top: 400px; transform: translateX(-50%); width: 1120px; box-sizing: border-box; padding: 56px 72px 52px; border-radius: 48px; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.32); box-shadow: inset 0 1px 0 rgba(255,255,255,0.40), 0 30px 90px rgba(40,52,61,0.22); backdrop-filter: blur(34px) saturate(110%); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;">
    <div style="font-size: 20px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(247,249,250,0.70); font-variant-numeric: tabular-nums;">Шаг 6 из 8   ·   до конца 0:55</div>
    <div style="font-size: 96px; font-weight: 500; line-height: 1.02; letter-spacing: -0.02em; color: #F7F9FA;">Движения глазами</div>
    <div style="font-size: 33px; line-height: 1.5; color: rgba(247,249,250,0.86); white-space: pre-wrap; text-wrap: balance;">Голова неподвижна, движения медленные и мягкие:
вверх-вниз  ·  влево-вправо  ·  по диагоналям  ·  круг в одну и в другую сторону.</div>
    <div style="margin-top: 10px; width: 100%; height: 4px; border-radius: 2px; background: rgba(247,249,250,0.16);">
      <div style="width: 50%; height: 100%; border-radius: 2px; background: rgba(247,249,250,0.75);"></div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); display: flex; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 17px 34px; border-radius: 999px; background: rgba(247,249,250,0.90); color: #4F5E69; font-size: 22px; font-weight: 500;">
      <span>Следующее</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; padding: 16px 32px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.32); backdrop-filter: blur(20px); color: #F7F9FA; font-size: 22px; font-weight: 500;">Отложить на 20 мин</div>
  </div>
</div>
</x-dc>
</body>
</html>
