    a { color: #A8703F; }
    a:hover { color: #7E5230; }
    @keyframes ripple {
      0%   { transform: scale(.2); opacity: 0; }
      14%  { opacity: .9; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .rip { animation: ripple 10s cubic-bezier(.22,.72,.35,1) infinite; }
    @media (prefers-reduced-motion: reduce) { .rip { animation: none; } }
  </style>
</helmet>
