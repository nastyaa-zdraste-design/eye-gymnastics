<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #D3D8DC; }
    a { color: #3E5143; }
    a:hover { color: #24321F; }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(0.42); }
      92%           { transform: scaleY(1); }
    }
    @keyframes driftA { from { transform: translate(0, 0) rotate(-6deg); } to { transform: translate(10px, -8px) rotate(4deg); } }
    @keyframes driftB { from { transform: translate(0, 0) rotate(5deg); }  to { transform: translate(-12px, 6px) rotate(-5deg); } }
    .lid { transform-origin: 50% 0; animation: blink 5s ease-in-out infinite; }
    .ga { animation: driftA 2.6s ease-in-out infinite alternate; }
    .gb { animation: driftB 3.1s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) { .lid, .ga, .gb { animation: none; } }
    @keyframes mblink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%           { transform: scaleY(2.2); }
    }
    .mlid { transform-box: fill-box; transform-origin: 50% 0; animation: mblink 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .mlid { animation: none; } }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(160deg, #DCE1E4 0%, #CBD1D6 100%); font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; left: 180px; top: 110px; width: 1000px; height: 640px; border-radius: 14px; background: #F8F8F6; box-shadow: 0 20px 60px rgba(0,0,0,0.16); overflow: hidden;">
    <div style="height: 44px; background: #EDEDEA; display: flex; align-items: center; gap: 8px; padding-left: 18px;">

      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>

  </div>

  <div style="position: absolute; left: 1020px; top: 300px; width: 720px; height: 480px; border-radius: 14px; background: #FAFAF8; box-shadow: 0 24px 70px rgba(0,0,0,0.18); overflow: hidden;">
    <div style="height: 44px; background: #EFEFEC; display: flex; align-items: center; gap: 8px; padding-left: 18px;">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>

  <div style="position: absolute; left: 0; bottom: 0; width: 1920px; height: 56px; background: rgba(246,246,244,0.92); display: flex; justify-content: center; align-items: center; gap: 12px;">

    <svg width="110" height="70" viewBox="0 0 110 70" style="overflow: visible;">
      <defs><clipPath id="almL"><path d="M5 35 Q55 -5 105 35 Q55 75 5 35 Z"></path></clipPath></defs>
      <path d="M5 35 Q55 -5 105 35 Q55 75 5 35 Z" fill="#FBFAF4"></path>

      <g clip-path="url(#almR)"><rect class="mlid" x="0" y="0" width="110" height="32" fill="#9DB095"></rect></g>
      <path d="M5 35 Q55 -5 105 35 Q55 75 5 35 Z" fill="none" stroke="#2F3D33" stroke-width="5" stroke-linejoin="round"></path>
    </svg>
  </div>

  <!-- облачко: матовое стекло -->
  <div style="position: absolute; left: 1307px; top: 960px; transform: translateX(-50%); padding: 9px 18px; border-radius: 18px; background: rgba(246,249,242,0.82); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 24px rgba(30,42,28,0.18); backdrop-filter: blur(14px); font-size: 21px; font-weight: 500; color: #24321F; white-space: nowrap;">
    <span>Мы устали…</span>

  <!-- призрачные курсоры в тонах Шалфея и настоящий курсор -->
  <svg class="ga" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 726px; top: 446px; opacity: 0.6;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg class="gb" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 798px; top: 498px; opacity: 0.48;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg class="ga" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 712px; top: 516px; opacity: 0.38; animation-delay: -1.2s;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 760px; top: 470px;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="#111111" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</div>
</x-dc>
