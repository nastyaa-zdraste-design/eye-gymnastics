<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400&amp;family=Mulish:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #0F2426; }
    a { color: #8FD1BF; }
    a:hover { color: #BFE8DC; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-480px); } }
    .waves { animation: drift 40s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .waves { animation: none; } }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1400px 1000px at 30% 45%, #173C3D 0%, #0F2426 70%); font-family: 'Mulish', 'Segoe UI', system-ui, sans-serif;">

  <svg class="waves" viewBox="0 0 2400 1080" style="position: absolute; left: 0; top: 0; width: 2400px; height: 1080px;">
    <defs>
      <pattern id="wave" width="480" height="38" patternUnits="userSpaceOnUse">
        <path d="M0 19 C80 7 160 7 240 19 C320 31 400 31 480 19" fill="none" stroke="rgba(170,222,208,0.11)" stroke-width="1.6"></path>
      </pattern>
    </defs>
    <rect width="2400" height="1080" fill="url(#wave)"></rect>
  </svg>

  <svg viewBox="0 0 1920 1080" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.07; mix-blend-mode: screen;">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
    <rect width="1920" height="1080" filter="url(#grain)"></rect>
  </svg>

  <div style="position: absolute; left: 160px; top: 50%; transform: translateY(-50%); width: 1020px; display: flex; flex-direction: column; gap: 28px;">
    <div style="font-size: 22px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(214,236,230,0.6); font-variant-numeric: tabular-nums;">Шаг 6 из 8   ·   до конца 0:55</div>
    <div style="font-family: 'Spectral', Georgia, serif; font-size: 116px; font-weight: 300; line-height: 1.02; color: #EAF4F1; text-wrap: balance;">Движения глазами</div>
    <div style="font-size: 36px; font-weight: 400; line-height: 1.55; color: rgba(214,236,230,0.84); white-space: pre-wrap; text-wrap: pretty;">Голова неподвижна, движения медленные и мягкие:
вверх-вниз  ·  влево-вправо  ·  по диагоналям  ·  круг в одну и в другую сторону.</div>
  </div>

  <div style="position: absolute; right: 115px; bottom: 88px; display: flex; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 32px; border-radius: 999px; background: rgba(143,209,191,0.16); border: 1px solid rgba(143,209,191,0.40); color: #EAF4F1; font-size: 22px; font-weight: 500;">
      <span>Следующее</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; padding: 16px 32px; border-radius: 999px; border: 1px solid rgba(214,236,230,0.22); color: rgba(234,244,241,0.86); font-size: 22px; font-weight: 500;">Отложить на 20 мин</div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 5px; background: rgba(214,236,230,0.08);">
    <div style="width: 71%; height: 100%; background: #8FD1BF;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
