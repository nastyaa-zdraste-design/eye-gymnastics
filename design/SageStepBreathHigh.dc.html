<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #667A61; }
    a { color: #F4F7F0; }
    a:hover { color: #FFFFFF; }
    @keyframes breathGlow {
      0%   { transform: translate(-50%, -50%) scale(0.66); opacity: 0.45; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      40%  { transform: translate(-50%, -50%) scale(1.22); opacity: 1;    animation-timing-function: cubic-bezier(.645, .045, .355, 1); }
      100% { transform: translate(-50%, -50%) scale(0.66); opacity: 0.45; }
    }
    @keyframes breathCore {
      0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.55; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
      40%  { transform: translate(-50%, -50%) scale(1.3); opacity: 1;    animation-timing-function: cubic-bezier(.645, .045, .355, 1); }
      100% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.55; }
    }
    @keyframes changePulse {
      0%, 42%   { transform: scale(1); }
      46%       { transform: scale(1.14); animation-timing-function: cubic-bezier(.645, .045, .355, 1); }
      56%, 92%  { transform: scale(1); }
      96%       { transform: scale(1.14); animation-timing-function: cubic-bezier(.645, .045, .355, 1); }
      100%      { transform: scale(1.03); }
    }
    @keyframes layerA {
      0%     { opacity: 1; transform: translateY(0); }
      41%    { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      43%    { opacity: 0; transform: translateY(-12px); }
      43.1%  { opacity: 0; transform: translateY(16px); }
      93%    { opacity: 0; transform: translateY(16px); animation-timing-function: cubic-bezier(.23, 1, .32, 1); }
      96%    { opacity: 1; transform: translateY(0); }
      100%   { opacity: 1; transform: translateY(0); }
    }
    @keyframes layerB {
      0%     { opacity: 0; transform: translateY(16px); }
      43%    { opacity: 0; transform: translateY(16px); animation-timing-function: cubic-bezier(.23, 1, .32, 1); }
      46%    { opacity: 1; transform: translateY(0); }
      91%    { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
      93%    { opacity: 0; transform: translateY(-12px); }
      93.1%  { opacity: 0; transform: translateY(16px); }
      100%   { opacity: 0; transform: translateY(16px); }
    }
    @keyframes fill {
      0%     { transform: scaleX(0.5); }
      41%    { transform: scaleX(1); }
      43%    { transform: scaleX(1); opacity: 1; }
      44%    { transform: scaleX(0); opacity: 0; }
      46%    { transform: scaleX(0); opacity: 1; }
      91%    { transform: scaleX(0.9); }
      93%    { transform: scaleX(0.9); opacity: 1; }
      94%    { transform: scaleX(0.5); opacity: 0; }
      96%    { transform: scaleX(0.5); opacity: 1; }
      100%   { transform: scaleX(0.5); }
    }
    .glow  { animation: breathGlow 10s infinite; will-change: transform, opacity; }
    .core  { animation: breathCore 10s infinite; will-change: transform, opacity; }
    .pulse { animation: changePulse 10s infinite; will-change: transform; }
    .a  { animation: layerA 10s infinite; }
    .b  { animation: layerB 10s infinite; }
    .d1 { animation-delay: 60ms; }
    .d2 { animation-delay: 120ms; }
    .fill { transform-origin: 0 50%; animation: fill 10s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .glow, .core, .pulse, .a, .b, .fill { animation: none; }
      .b { opacity: 0; }
    }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1600px 1100px at 50% 25%, #7E9278 0%, #667A61 55%, #4C5E48 100%); font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif;">

  <div class="pulse" style="position: absolute; left: 960px; top: 250px; width: 0; height: 0;">
    <div class="glow" style="position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,246,222,0.95) 0%, rgba(250,236,200,0.7) 20%, rgba(232,226,180,0.25) 42%, rgba(232,226,180,0) 64%);"></div>
    <div class="core" style="position: absolute; left: 0; top: 0; width: 380px; height: 380px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, #FFFBF0 0%, rgba(255,244,218,0.98) 42%, rgba(255,236,196,0) 72%);"></div>
  </div>

  <div style="position: absolute; left: 50%; top: 420px; transform: translateX(-50%); width: 1120px; box-sizing: border-box; padding: 56px 72px 52px; border-radius: 48px; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.32); box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), 0 30px 80px rgba(30,42,28,0.24); backdrop-filter: blur(30px) saturate(110%); display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center;">
    <div style="display: grid; width: 100%;">
      <div style="grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
        <div class="a" style="font-size: 20px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244,247,240,0.72); font-variant-numeric: tabular-nums;">Шаг 6 из 8   ·   до конца 0:55</div>
        <div class="a d1" style="font-size: 96px; font-weight: 500; line-height: 1.02; letter-spacing: -0.02em; color: #F7F9F3;">Движения глазами</div>
        <div class="a d2" style="font-size: 33px; line-height: 1.5; color: rgba(244,247,240,0.9); white-space: pre-wrap; text-wrap: balance;">Голова неподвижна, движения медленные и мягкие:
вверх-вниз  ·  влево-вправо  ·  по диагоналям  ·  круг в одну и в другую сторону.</div>
      </div>
      <div style="grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
        <div class="b" style="opacity: 0; font-size: 20px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244,247,240,0.72); font-variant-numeric: tabular-nums;">Шаг 7 из 8   ·   до конца 0:35</div>
        <div class="b d1" style="opacity: 0; font-size: 96px; font-weight: 500; line-height: 1.02; letter-spacing: -0.02em; color: #F7F9F3;">Снятие напряжения</div>
        <div class="b d2" style="opacity: 0; font-size: 33px; line-height: 1.5; color: rgba(244,247,240,0.9); white-space: pre-wrap; text-wrap: balance;">Зажмурься на 2 секунды и широко открой глаза.</div>
      </div>
    </div>
    <div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(244,247,240,0.20); overflow: hidden;">
      <div class="fill" style="width: 100%; height: 100%; border-radius: 2px; background: rgba(244,247,240,0.85); transform: scaleX(0.5); transform-origin: 0 50%;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 17px 34px; border-radius: 999px; background: #F4F7F0; color: #3E5143; font-size: 22px; font-weight: 500;">
      <span>Следующее</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; padding: 16px 32px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.32); backdrop-filter: blur(16px); color: #F4F7F0; font-size: 22px; font-weight: 500;">Отложить на 20 мин</div>
  </div>
</div>
</x-dc>
</body>
</html>
