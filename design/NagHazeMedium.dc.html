<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #D3D8DC; }
    a { color: #3E5143; }
    a:hover { color: #24321F; }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(0.42); }
      92%           { transform: scaleY(1); }
    }
    @keyframes driftA { from { transform: translate(0, 0) rotate(-6deg); } to { transform: translate(10px, -8px) rotate(4deg); } }
    @keyframes driftB { from { transform: translate(0, 0) rotate(5deg); }  to { transform: translate(-12px, 6px) rotate(-5deg); } }
    .lid { transform-origin: 50% 0; animation: blink 5s ease-in-out infinite; }
    .ga { animation: driftA 2.6s ease-in-out infinite alternate; }
    .gb { animation: driftB 3.1s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) { .lid, .ga, .gb { animation: none; } }
    @keyframes haze { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .haze { animation: haze 7s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .haze { animation: none; } }
  </style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(160deg, #DCE1E4 0%, #CBD1D6 100%); font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif;">

  <div style="position: absolute; left: 180px; top: 110px; width: 1000px; height: 640px; border-radius: 14px; background: #F8F8F6; box-shadow: 0 20px 60px rgba(0,0,0,0.16); overflow: hidden;">
    <div style="height: 44px; background: #EDEDEA; display: flex; align-items: center; gap: 8px; padding-left: 18px;">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
    </div>
    <div style="padding: 36px 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 420px; height: 20px; border-radius: 10px; background: #E1E1DD;"></div>
      <div style="width: 820px; height: 12px; border-radius: 6px; background: #E8E8E4;"></div>
      <div style="width: 760px; height: 12px; border-radius: 6px; background: #E8E8E4;"></div>
      <div style="width: 800px; height: 12px; border-radius: 6px; background: #E8E8E4;"></div>
      <div style="margin-top: 12px; width: 920px; height: 220px; border-radius: 10px; background: #EEEEEA;"></div>
      <div style="width: 680px; height: 12px; border-radius: 6px; background: #E8E8E4;"></div>
      <div style="width: 740px; height: 12px; border-radius: 6px; background: #E8E8E4;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 1020px; top: 300px; width: 720px; height: 480px; border-radius: 14px; background: #FAFAF8; box-shadow: 0 24px 70px rgba(0,0,0,0.18); overflow: hidden;">
    <div style="height: 44px; background: #EFEFEC; display: flex; align-items: center; gap: 8px; padding-left: 18px;">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #D3D3CF;"></div>
    </div>
    <div style="padding: 32px 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
      <div style="height: 120px; border-radius: 10px; background: #ECECE8;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 1920px; height: 56px; background: rgba(246,246,244,0.92); display: flex; justify-content: center; align-items: center; gap: 12px;">
    <div style="width: 34px; height: 34px; border-radius: 8px; background: #D3D3CF;"></div>
    <div style="width: 34px; height: 34px; border-radius: 8px; background: #D3D3CF;"></div>
    <div style="width: 34px; height: 34px; border-radius: 8px; background: #D3D3CF;"></div>
    <div style="width: 34px; height: 34px; border-radius: 8px; background: #D3D3CF;"></div>
    <div style="width: 34px; height: 34px; border-radius: 8px; background: #D3D3CF;"></div>
  </div>

  <div class="haze" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(40,56,38,0) 48%, rgba(40,56,38,0.28) 78%, rgba(30,44,28,0.55) 100%);"></div>

  <!-- глаза: мягкие объёмные -->
  <div style="position: absolute; left: 1170px; bottom: -18px; display: flex; gap: 10px;">
    <div style="position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 45% 35%, #FFFFFF 0%, #FBF8EF 45%, #E9E2D0 80%, #D8CFBA 100%); box-shadow: 0 12px 26px rgba(30,42,28,0.30), inset 0 -12px 20px rgba(120,110,80,0.20);">
      <div style="position: absolute; width: 54%; height: 54%; left: 16%; top: 20%; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #BFD0A8 0%, #7E9A6B 48%, #4E6A45 84%); box-shadow: inset 0 0 0 3px rgba(40,55,35,0.30);">
        <div style="position: absolute; inset: 28%; border-radius: 50%; background: #1B2618;"></div>
        <div style="position: absolute; width: 13%; height: 13%; left: 62%; top: 60%; border-radius: 50%; background: rgba(255,255,255,0.8);"></div>
      </div>
      <div class="lid" style="position: absolute; left: -8%; right: -8%; top: -8%; height: 116%; transform-origin: 50% 0; transform: scaleY(0.42); background: linear-gradient(#BCCDB3, #94AA89); border-radius: 0 0 50% 50% / 0 0 16% 16%; box-shadow: 0 8px 12px rgba(30,42,28,0.25);"></div>
    </div>
    <div style="position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 45% 35%, #FFFFFF 0%, #FBF8EF 45%, #E9E2D0 80%, #D8CFBA 100%); box-shadow: 0 12px 26px rgba(30,42,28,0.30), inset 0 -12px 20px rgba(120,110,80,0.20);">
      <div style="position: absolute; width: 54%; height: 54%; left: 16%; top: 20%; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #BFD0A8 0%, #7E9A6B 48%, #4E6A45 84%); box-shadow: inset 0 0 0 3px rgba(40,55,35,0.30);">
        <div style="position: absolute; inset: 28%; border-radius: 50%; background: #1B2618;"></div>
        <div style="position: absolute; width: 13%; height: 13%; left: 62%; top: 60%; border-radius: 50%; background: rgba(255,255,255,0.8);"></div>
      </div>
      <div class="lid" style="position: absolute; left: -8%; right: -8%; top: -8%; height: 116%; transform-origin: 50% 0; transform: scaleY(0.42); background: linear-gradient(#BCCDB3, #94AA89); border-radius: 0 0 50% 50% / 0 0 16% 16%; box-shadow: 0 8px 12px rgba(30,42,28,0.25);"></div>
    </div>
  </div>

  <!-- облачко: матовое стекло -->
  <div style="position: absolute; left: 1315px; top: 890px; transform: translateX(-50%); padding: 9px 18px; border-radius: 18px; background: rgba(246,249,242,0.82); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 24px rgba(30,42,28,0.18); backdrop-filter: blur(14px); font-size: 21px; font-weight: 500; color: #24321F; white-space: nowrap;">
    <span>Мы устали…</span>
    <div style="position: absolute; left: 50%; top: 100%; width: 14px; height: 14px; transform: translate(-50%, -50%) rotate(45deg); background: #F3F6EF;"></div>
  </div>

  <!-- призрачные курсоры в тонах Шалфея и настоящий курсор -->
  <svg class="ga" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 726px; top: 446px; opacity: 0.6;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg class="gb" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 798px; top: 498px; opacity: 0.48;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg class="ga" width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 712px; top: 516px; opacity: 0.38; animation-delay: -1.2s;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="rgba(246,249,242,0.92)" stroke="#3E5143" stroke-width="1.2" stroke-linejoin="round"></path></svg>
  <svg width="26" height="39" viewBox="0 0 16 24" style="position: absolute; left: 760px; top: 470px;"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.4 20.8 L8.4 13.8 L14.5 13.8 Z" fill="#111111" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</div>
</x-dc>
</body>
</html>
